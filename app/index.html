:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,

  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {

  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:

    border-color 150ms,

              &lt;div class=&quot;seka-admin-order-row&quot; data-order-id=&quot;1049&quot;&gt;&lt;div&gt;&lt;strong&gt;Ордер №1049 · 5 000 фишек&lt;/strong&gt;&lt;small&gt;Осталось 5 000 · номер **** 9320&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;seka-order-status&quot;&gt;Активен&lt;/span&gt;&lt;div class=&quot;seka-admin-order-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-action&quot; data-edit-order=&quot;1049&quot;&gt;Изменить&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-action seka-danger&quot; data-cancel-order=&quot;1049&quot;&gt;Отменить&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;

          &lt;div class=&quot;seka-admin-placeholder&quot;&gt;&lt;h3&gt;Споры, жалобы и предложения&lt;/h3&gt;&lt;p&gt;Единая очередь обращений со связью с игрой, игроком, историей чата и решением администратора.&lt;/p&gt;&lt;div class=&quot;seka-admin-tools&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-tool&quot; data-action=&quot;disputes&quot;&gt;Открытые споры · 3&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-tool&quot; data-action=&quot;complaints&quot;&gt;Жалобы · 4&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-tool&quot; data-action=&quot;suggestions&quot;&gt;Предложения · 18&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;aside class=&quot;seka-transfer-sheet&quot; aria-label=&quot;P2P-маркет&quot; aria-hidden=&quot;true&quot;&gt;

    &lt;div class=&quot;seka-sheet-head&quot;&gt;&lt;h3 data-p2p-title&gt;Купить фишки&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;seka-sheet-close&quot; data-close-sheet aria-label=&quot;Закрыть&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;seka-p2p-view seka-p2p-visible&quot; data-p2p-view=&quot;buy&quot;&gt;
      &lt;p class=&quot;seka-p2p-note&quot;&gt;Выбор продавца и ордера не требуется. Система автоматически выдаёт первый доступный ордер очереди.&lt;/p&gt;
      &lt;div class=&quot;seka-queue-lot&quot; data-current-order&gt;
        &lt;div class=&quot;seka-queue-head&quot;&gt;&lt;strong&gt;Ордер №&lt;span data-queue-id&gt;1051&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;Первый в очереди&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seka-lot-amount&quot;&gt;5 000 &lt;span&gt;фишек&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;seka-lot-remaining&quot;&gt;В ордере осталось: &lt;strong data-queue-remaining&gt;10 000&lt;/strong&gt; фишек&lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;seka-lot-buy&quot; data-buy-lot&gt;Купить 5 000 фишек&lt;/button&gt;

      &lt;div class=&quot;seka-transfer-form&quot;&gt;
        &lt;div class=&quot;seka-transfer-field&quot;&gt;&lt;label for=&quot;seka-order-amount&quot;&gt;Количество фишек&lt;/label&gt;&lt;input id=&quot;seka-order-amount&quot; type=&quot;number&quot; value=&quot;10000&quot; min=&quot;5000&quot; step=&quot;5000&quot; aria-label=&quot;Количество фишек&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;seka-transfer-field&quot;&gt;&lt;label for=&quot;seka-payment-number&quot;&gt;Номер для выплаты&lt;/label&gt;&lt;input id=&quot;seka-payment-number&quot; type=&quot;text&quot; value=&quot;8600 1234 5678 8602&quot; aria-label=&quot;Номер для выплаты&quot;&gt;&lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;seka-transfer-submit&quot; data-create-order&gt;Выставить ордер на продажу&lt;/button&gt;
      &lt;/div&gt;
      &lt;small class=&quot;seka-sell-lock&quot;&gt;Количество должно быть кратно 5 000 фишек. После публикации изменить или отменить ордер может только администратор.&lt;/small&gt;
    &lt;/div&gt;
  &lt;/aside&gt;

  &lt;aside class=&quot;seka-bet-sheet&quot; aria-label=&quot;Повышение ставки&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;div class=&quot;seka-sheet-handle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;seka-sheet-head&quot;&gt;&lt;h3&gt;Повысить ставку&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;seka-sheet-close&quot; data-close-sheet aria-label=&quot;Закрыть&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;seka-bet-value&quot;&gt;&lt;small&gt;Ставка в банк&lt;/small&gt;&lt;strong&gt;&lt;span data-bet-value&gt;600&lt;/span&gt; фишек&lt;/strong&gt;&lt;/div&gt;
    &lt;input class=&quot;seka-bet-range&quot; type=&quot;range&quot; min=&quot;500&quot; max=&quot;2000&quot; value=&quot;600&quot; step=&quot;100&quot; aria-label=&quot;Размер ставки&quot;&gt;
    &lt;div class=&quot;seka-bet-limits&quot;&gt;&lt;span&gt;Минимум 500&lt;/span&gt;&lt;span&gt;Потолок 2 000&lt;/span&gt;&lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;seka-bet-confirm&quot; data-confirm-bet&gt;Повысить ставку&lt;/button&gt;
  &lt;/aside&gt;

  &lt;aside class=&quot;seka-deals-sheet&quot; aria-label=&quot;Сделки&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;div class=&quot;seka-sheet-handle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;seka-sheet-head&quot;&gt;&lt;h3&gt;Сделки&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;seka-sheet-close&quot; data-close-sheet aria-label=&quot;Закрыть&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;seka-history-list&quot; data-deals-list&gt;
      &lt;div class=&quot;seka-history-row&quot;&gt;&lt;div class=&quot;seka-history-icon&quot;&gt;♠&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Победа · Ташкент 12&lt;/strong&gt;&lt;small&gt;Сегодня, 18:42 · игра #18391&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;seka-history-amount seka-positive&quot;&gt;+1 600&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;seka-history-row&quot;&gt;&lt;div class=&quot;seka-history-icon&quot;&gt;↓&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Покупка · ордер №1044&lt;/strong&gt;&lt;small&gt;Сегодня, 16:05 · завершено&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;seka-history-amount seka-positive&quot;&gt;+5 000&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;seka-history-row&quot;&gt;&lt;div class=&quot;seka-history-icon&quot;&gt;↑&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Продажа · ордер №1038&lt;/strong&gt;&lt;small&gt;Вчера, 21:18 · завершено&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;seka-history-amount&quot;&gt;−5 000&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/aside&gt;

  &lt;div class=&quot;seka-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;Готово&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;seka-mini-app&#x27;);
  if (!root || root.dataset.ready === &#x27;true&#x27;) return;
  root.dataset.ready = &#x27;true&#x27;;

  const screens = [...root.querySelectorAll(&#x27;[data-screen]&#x27;)];
  const nav = root.querySelector(&#x27;.seka-bottom-nav&#x27;);
  const tableScreen = root.querySelector(&#x27;[data-screen=&quot;table&quot;]&#x27;);
  const chatSheet = root.querySelector(&#x27;.seka-chat-sheet&#x27;);
  const transferSheet = root.querySelector(&#x27;.seka-transfer-sheet&#x27;);
  const betSheet = root.querySelector(&#x27;.seka-bet-sheet&#x27;);
  const dealsSheet = root.querySelector(&#x27;.seka-deals-sheet&#x27;);
  const toast = root.querySelector(&#x27;.seka-toast&#x27;);
  const telegramApp = window.Telegram?.WebApp || null;
  const routeHistory = [];
  const orderQueue = [
    { id: 1051, total: 10000, remaining: 10000 },
    { id: 1050, total: 15000, remaining: 15000 },
    { id: 1049, total: 5000, remaining: 5000 }
  ];
  let activeScreen = &#x27;lobby&#x27;;
  let activeObserver = false;
  let toastTimer;

  const haptic = (kind = &#x27;selection&#x27;) =&gt; {
    try {
      const feedback = telegramApp?.HapticFeedback;
      if (!feedback) return;
      if (kind === &#x27;success&#x27;) feedback.notificationOccurred(&#x27;success&#x27;);
      else feedback.selectionChanged();
    } catch (_) {}
  };

  const showToast = message =&gt; {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add(&#x27;seka-toast-show&#x27;);
    toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;seka-toast-show&#x27;), 1700);
  };

  const closeSheets = () =&gt; {
    [chatSheet, transferSheet, betSheet, dealsSheet].forEach(sheet =&gt; {
      sheet.classList.remove(&#x27;seka-sheet-open&#x27;);
      sheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
    });
  };

  const renderQueueHead = () =&gt; {
    while (orderQueue.length &amp;&amp; orderQueue[0].remaining &lt;= 0) orderQueue.shift();
    const current = orderQueue[0];
    const panel = root.querySelector(&#x27;[data-current-order]&#x27;);
    const buyButton = panel.querySelector(&#x27;[data-buy-lot]&#x27;);
    if (!current) {
      panel.querySelector(&#x27;[data-queue-id]&#x27;).textContent = &#x27;—&#x27;;
      panel.querySelector(&#x27;[data-queue-remaining]&#x27;).textContent = &#x27;0&#x27;;
      buyButton.textContent = &#x27;Нет доступных ордеров&#x27;;
      buyButton.disabled = true;
      return;
    }
    panel.dataset.orderId = String(current.id);
    panel.querySelector(&#x27;[data-queue-id]&#x27;).textContent = String(current.id);
    panel.querySelector(&#x27;[data-queue-remaining]&#x27;).textContent = current.remaining.toLocaleString(&#x27;ru-RU&#x27;);
    buyButton.textContent = &#x27;Купить 5 000 фишек&#x27;;
    buyButton.disabled = false;

    const adminRow = root.querySelector(`.seka-admin-order-row[data-order-id=&quot;${current.id}&quot;]`);
    const adminDetails = adminRow?.querySelector(&#x27;small&#x27;);
    if (adminDetails) {
      const numberText = adminDetails.textContent.includes(&#x27;номер&#x27;) ? adminDetails.textContent.split(&#x27;номер&#x27;)[1] : &#x27;&#x27;;
      adminDetails.textContent = `Осталось ${current.remaining.toLocaleString(&#x27;ru-RU&#x27;)} · номер${numberText}`;
    }
  };

  const syncNativeBackButton = () =&gt; {
    if (!telegramApp?.BackButton) return;
    if (activeScreen === &#x27;lobby&#x27;) telegramApp.BackButton.hide();
    else telegramApp.BackButton.show();
  };

  const syncTelegramViewport = () =&gt; {
    if (!telegramApp) return;
    const height = telegramApp.viewportHeight || telegramApp.viewportStableHeight || window.innerHeight;
    if (height &gt; 0) root.style.setProperty(&#x27;--seka-app-height&#x27;, `${Math.round(height)}px`);
    const inset = telegramApp.contentSafeAreaInset || telegramApp.safeAreaInset;
    if (inset) {
      root.style.setProperty(&#x27;--seka-safe-top&#x27;, `${inset.top || 0}px`);
      root.style.setProperty(&#x27;--seka-safe-right&#x27;, `${inset.right || 0}px`);
      root.style.setProperty(&#x27;--seka-safe-bottom&#x27;, `${inset.bottom || 0}px`);
      root.style.setProperty(&#x27;--seka-safe-left&#x27;, `${inset.left || 0}px`);
    }
  };

  const navigate = (name, observer = false, options = {}) =&gt; {
    if (!screens.some(screen =&gt; screen.dataset.screen === name)) return;
    if (name !== activeScreen &amp;&amp; options.record !== false) {
      routeHistory.push({ screen: activeScreen, observer: activeObserver });
    }
    closeSheets();
    screens.forEach(screen =&gt; {
      const isCurrent = screen.dataset.screen === name;
      screen.classList.toggle(&#x27;seka-visible&#x27;, isCurrent);
      screen.classList.toggle(&#x27;seka-leaving&#x27;, !isCurrent &amp;&amp; screen.dataset.screen === activeScreen);
      if (isCurrent) screen.scrollTop = 0;
    });
    root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button =&gt; {
      if (button.classList.contains(&#x27;seka-nav-choice&#x27;)) button.setAttribute(&#x27;aria-current&#x27;, button.dataset.go === name ? &#x27;page&#x27; : &#x27;false&#x27;);
    });
    nav.classList.toggle(&#x27;seka-nav-hidden&#x27;, name === &#x27;admin&#x27;);
    root.querySelector(&#x27;.seka-balance-chip&#x27;).style.visibility = name === &#x27;admin&#x27; ? &#x27;hidden&#x27; : &#x27;visible&#x27;;
    tableScreen.classList.toggle(&#x27;seka-observer-mode&#x27;, name === &#x27;table&#x27; &amp;&amp; observer);
    root.classList.toggle(&#x27;seka-immersive-table&#x27;, name === &#x27;table&#x27;);
    activeScreen = name;
    activeObserver = name === &#x27;table&#x27; &amp;&amp; observer;
    syncNativeBackButton();
    try {
      if (telegramApp?.disableVerticalSwipes &amp;&amp; name === &#x27;table&#x27;) telegramApp.disableVerticalSwipes();
      if (telegramApp?.enableVerticalSwipes &amp;&amp; name !== &#x27;table&#x27;) telegramApp.enableVerticalSwipes();
    } catch (_) {}
    haptic();
  };

  const navigateBack = () =&gt; {
    closeSheets();
    const previous = routeHistory.pop();
    if (previous) navigate(previous.screen, previous.observer, { record: false });
    else if (activeScreen !== &#x27;lobby&#x27;) navigate(&#x27;lobby&#x27;, false, { record: false });
  };

  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const go = event.target.closest(&#x27;[data-go]&#x27;);
    if (go) navigate(go.dataset.go);

    if (event.target.closest(&#x27;[data-back]&#x27;)) navigateBack();

    const enter = event.target.closest(&#x27;[data-enter]&#x27;);
    if (enter) navigate(&#x27;table&#x27;, enter.dataset.enter === &#x27;watch&#x27;);

    const role = event.target.closest(&#x27;[data-role]&#x27;);
    if (role) {
      root.querySelectorAll(&#x27;[data-role]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, button === role ? &#x27;true&#x27; : &#x27;false&#x27;));
      navigate(role.dataset.role === &#x27;admin&#x27; ? &#x27;admin&#x27; : &#x27;lobby&#x27;);
    }

    const modeChoice = event.target.closest(&#x27;.seka-mode-choice&#x27;);
    if (modeChoice) {
      root.querySelectorAll(&#x27;.seka-mode-choice&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, button === modeChoice ? &#x27;true&#x27; : &#x27;false&#x27;));
      showToast(`Режим: ${modeChoice.textContent.trim()}`);
    }

    const filterChoice = event.target.closest(&#x27;.seka-filter-choice&#x27;);
    if (filterChoice) {
      filterChoice.setAttribute(&#x27;aria-pressed&#x27;, filterChoice.getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27; ? &#x27;false&#x27; : &#x27;true&#x27;);
      showToast(&#x27;Фильтр обновлён&#x27;);
    }

    const adminTab = event.target.closest(&#x27;[data-admin]&#x27;);
    if (adminTab) {
      root.querySelectorAll(&#x27;[data-admin]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, button === adminTab ? &#x27;true&#x27; : &#x27;false&#x27;));
      root.querySelectorAll(&#x27;[data-admin-panel]&#x27;).forEach(panel =&gt; panel.classList.toggle(&#x27;seka-admin-panel-visible&#x27;, panel.dataset.adminPanel === adminTab.dataset.admin));
      haptic();
    }

    if (event.target.closest(&#x27;[data-open-chat]&#x27;)) {
      chatSheet.classList.add(&#x27;seka-sheet-open&#x27;);
      chatSheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
      haptic();
    }

    if (event.target.closest(&#x27;[data-close-sheet]&#x27;)) closeSheets();

    const quick = event.target.closest(&#x27;.seka-quick-message&#x27;);
    if (quick) {
      const speech = root.querySelector(&#x27;.seka-player[data-seat=&quot;5&quot;] .seka-speech&#x27;);
      speech.textContent = quick.textContent.trim();
      speech.classList.add(&#x27;seka-say&#x27;);
      closeSheets();
      setTimeout(() =&gt; speech.classList.remove(&#x27;seka-say&#x27;), 2200);
      haptic(&#x27;success&#x27;);
    }

    const gameAction = event.target.closest(&#x27;[data-game-action]&#x27;);
    if (gameAction) {
      if (gameAction.dataset.gameAction === &#x27;Повысить&#x27;) {
        betSheet.classList.add(&#x27;seka-sheet-open&#x27;);
        betSheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
        haptic();
        return;
      }
      const pot = root.querySelector(&#x27;[data-pot]&#x27;);
      const values = { &#x27;Упасть&#x27;: 1600, &#x27;Поддержать&#x27;: 2000, &#x27;Вскрыться&#x27;: 2000 };
      pot.textContent = values[gameAction.dataset.gameAction].toLocaleString(&#x27;ru-RU&#x27;);
      pot.animate([{ transform: &#x27;translate(-50%,-50%) scale(1)&#x27; }, { transform: &#x27;translate(-50%,-50%) scale(1.12)&#x27; }, { transform: &#x27;translate(-50%,-50%) scale(1)&#x27; }], { duration: 320, easing: &#x27;ease-out&#x27; });
      if (gameAction.dataset.gameAction === &#x27;Вскрыться&#x27;) {
        const opponent = root.querySelector(&#x27;.seka-player[data-seat=&quot;4&quot;]&#x27;);
        opponent.classList.add(&#x27;seka-eliminated&#x27;);
        const speech = opponent.querySelector(&#x27;.seka-speech&#x27;);
        speech.textContent = &#x27;Комбинация слабее · выбыл&#x27;;
        speech.classList.add(&#x27;seka-say&#x27;);
        setTimeout(() =&gt; speech.classList.remove(&#x27;seka-say&#x27;), 2400);
        showToast(&#x27;Сравнение выполнено без показа карт соперника&#x27;);
      } else if (gameAction.dataset.gameAction === &#x27;Упасть&#x27;) {
        showToast(&#x27;Карты сброшены · место за столом сохранено&#x27;);
      } else showToast(&#x27;Ставка поддержана · 400 фишек в банк&#x27;);
      haptic(&#x27;success&#x27;);
    }

    const p2p = event.target.closest(&#x27;[data-p2p]&#x27;);
    if (p2p) {
      const mode = p2p.dataset.p2p;
      if (mode === &#x27;buy&#x27;) renderQueueHead();
      root.querySelector(&#x27;[data-p2p-title]&#x27;).textContent = mode === &#x27;buy&#x27; ? &#x27;Купить фишки&#x27; : &#x27;Продать фишки&#x27;;
      root.querySelectorAll(&#x27;[data-p2p-view]&#x27;).forEach(view =&gt; view.classList.toggle(&#x27;seka-p2p-visible&#x27;, view.dataset.p2pView === mode));
      transferSheet.classList.add(&#x27;seka-sheet-open&#x27;);
      transferSheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
      haptic();
    }

    if (event.target.closest(&#x27;[data-deals]&#x27;)) {
      dealsSheet.classList.add(&#x27;seka-sheet-open&#x27;);
      dealsSheet.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
      haptic();
    }

    if (event.target.closest(&#x27;[data-buy-lot]&#x27;)) {
      const current = orderQueue[0];
      if (!current) return;
      current.remaining -= 5000;
      const balances = [...root.querySelectorAll(&#x27;[data-wallet-balance]&#x27;)];
      const currentBalance = Number(balances[0].textContent.replace(/\D/g, &#x27;&#x27;)) || 0;
      balances.forEach(node =&gt; node.textContent = (currentBalance + 5000).toLocaleString(&#x27;ru-RU&#x27;));

      const dealRow = document.createElement(&#x27;div&#x27;);
      dealRow.className = &#x27;seka-history-row&#x27;;
      dealRow.innerHTML = `&lt;div class=&quot;seka-history-icon&quot;&gt;↓&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Покупка · ордер №${current.id}&lt;/strong&gt;&lt;small&gt;Только что · завершено&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;seka-history-amount seka-positive&quot;&gt;+5 000&lt;/div&gt;`;
      root.querySelector(&#x27;[data-deals-list]&#x27;).prepend(dealRow);

      if (current.remaining &lt;= 0) {
        const completedRow = root.querySelector(`.seka-admin-order-row[data-order-id=&quot;${current.id}&quot;]`);
        if (completedRow) {
          completedRow.querySelector(&#x27;.seka-order-status&#x27;).textContent = &#x27;Исполнен&#x27;;
          completedRow.querySelector(&#x27;.seka-order-status&#x27;).style.color = &#x27;var(--seka-muted)&#x27;;
          completedRow.querySelector(&#x27;.seka-admin-order-actions&#x27;).innerHTML = &#x27;&#x27;;
          const details = completedRow.querySelector(&#x27;small&#x27;);
          const numberText = details.textContent.includes(&#x27;номер&#x27;) ? details.textContent.split(&#x27;номер&#x27;)[1] : &#x27;&#x27;;
          details.textContent = `Осталось 0 · номер${numberText}`;
        }
      }

      showToast(`Куплено 5 000 фишек из ордера №${current.id}`);
      renderQueueHead();
      haptic(&#x27;success&#x27;);
    }

    const editOrder = event.target.closest(&#x27;[data-edit-order]&#x27;);
    if (editOrder) {
      const id = editOrder.dataset.editOrder;
      const adminRow = root.querySelector(`.seka-admin-order-row[data-order-id=&quot;${id}&quot;]`);
      const queueItem = orderQueue.find(order =&gt; order.id === Number(id));
      const currentAmount = queueItem?.total || 0;
      const nextAmount = currentAmount + 5000;
      if (queueItem) {
        queueItem.total = nextAmount;
        queueItem.remaining += 5000;
      }
      if (adminRow) {
        const title = adminRow.querySelector(&#x27;strong&#x27;);
        title.textContent = `Ордер №${id} · ${nextAmount.toLocaleString(&#x27;ru-RU&#x27;)} фишек`;
        const details = adminRow.querySelector(&#x27;small&#x27;);
        const numberText = details.textContent.includes(&#x27;номер&#x27;) ? details.textContent.split(&#x27;номер&#x27;)[1] : &#x27;&#x27;;
        details.textContent = `Осталось ${(queueItem?.remaining || nextAmount).toLocaleString(&#x27;ru-RU&#x27;)} · номер${numberText}`;
      }
      renderQueueHead();
      showToast(`Ордер №${id} изменён администратором`);
      haptic(&#x27;success&#x27;);
    }

    const cancelOrder = event.target.closest(&#x27;[data-cancel-order]&#x27;);
    if (cancelOrder) {
      const id = cancelOrder.dataset.cancelOrder;
      root.querySelector(`.seka-admin-order-row[data-order-id=&quot;${id}&quot;]`)?.remove();
      const queueIndex = orderQueue.findIndex(order =&gt; order.id === Number(id));
      if (queueIndex &gt;= 0) orderQueue.splice(queueIndex, 1);
      renderQueueHead();
      showToast(`Ордер №${id} отменён администратором`);
      haptic(&#x27;success&#x27;);
    }

    const action = event.target.closest(&#x27;[data-action]&#x27;);
    if (action) {
      const labels = {
        &#x27;inspect&#x27;: &#x27;Игра открыта в режиме наблюдения&#x27;, &#x27;pause&#x27;: &#x27;Требуется подтверждение администратора&#x27;,
        &#x27;join-friend&#x27;: &#x27;Подключаемся к столу друга&#x27;, &#x27;invite&#x27;: &#x27;Приглашение отправлено&#x27;, &#x27;share&#x27;: &#x27;Открыто меню Telegram&#x27;,
        &#x27;history&#x27;: &#x27;История уже показана ниже&#x27;, &#x27;find-player&#x27;: &#x27;Поиск игрока открыт&#x27;, &#x27;chips-add&#x27;: &#x27;Открыта корректировка баланса&#x27;,
        &#x27;chips-remove&#x27;: &#x27;Открыта корректировка баланса&#x27;, &#x27;block-player&#x27;: &#x27;Открыта карточка блокировки&#x27;, &#x27;remove-player&#x27;: &#x27;Выберите активный стол игрока&#x27;,
        &#x27;create-table&#x27;: &#x27;Конструктор стола открыт&#x27;, &#x27;edit-limits&#x27;: &#x27;Настройки лимитов открыты&#x27;, &#x27;game-search&#x27;: &#x27;Поиск по ID игры открыт&#x27;,
        &#x27;export&#x27;: &#x27;Экспорт подготовлен&#x27;, &#x27;replay&#x27;: &#x27;Повтор игры открыт&#x27;, &#x27;p2p-monitor&#x27;: &#x27;Мониторинг P2P открыт&#x27;,
        &#x27;p2p-settings&#x27;: &#x27;Настройки P2P открыты&#x27;, &#x27;audit&#x27;: &#x27;Журнал операций открыт&#x27;, &#x27;disputes&#x27;: &#x27;Очередь споров открыта&#x27;,
        &#x27;complaints&#x27;: &#x27;Очередь жалоб открыта&#x27;, &#x27;suggestions&#x27;: &#x27;Предложения открыты&#x27;, &#x27;game-rules&#x27;: &#x27;Редактор правил открыт&#x27;,
        &#x27;roles&#x27;: &#x27;Управление доступами открыто&#x27;, &#x27;templates&#x27;: &#x27;Шаблоны сообщений открыты&#x27;, &#x27;menu&#x27;: &#x27;Меню стола открыто&#x27;
      };
      showToast(labels[action.dataset.action] || &#x27;Действие выполнено&#x27;);
    }
  });

  root.querySelector(&#x27;[data-send-chat]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const input = root.querySelector(&#x27;.seka-chat-compose input&#x27;);
    const value = input.value.trim();
    if (!value) return;
    const line = document.createElement(&#x27;div&#x27;);
    line.className = &#x27;seka-chat-line&#x27;;
    line.innerHTML = &#x27;&lt;b&gt;Вы:&lt;/b&gt; &#x27;;
    line.append(document.createTextNode(value));
    root.querySelector(&#x27;.seka-chat-log&#x27;).append(line);
    input.value = &#x27;&#x27;;
    haptic(&#x27;success&#x27;);
  });

  root.querySelector(&#x27;[data-create-order]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const amount = Number(root.querySelector(&#x27;#seka-order-amount&#x27;).value) || 0;
    if (amount &lt; 5000 || amount % 5000 !== 0) {
      showToast(&#x27;Количество должно быть кратно 5 000 фишек&#x27;);
      haptic();
      return;
    }
    const number = root.querySelector(&#x27;#seka-payment-number&#x27;).value.replace(/\D/g, &#x27;&#x27;);
    const lastFour = number.slice(-4) || &#x27;—&#x27;;
    const ids = [...root.querySelectorAll(&#x27;[data-order-id]&#x27;)].map(node =&gt; Number(node.dataset.orderId) || 0);
    const id = Math.max(1051, ...ids) + 1;
    orderQueue.push({ id, total: amount, remaining: amount });

    const adminRow = document.createElement(&#x27;div&#x27;);
    adminRow.className = &#x27;seka-admin-order-row&#x27;;
    adminRow.dataset.orderId = String(id);
    adminRow.innerHTML = `&lt;div&gt;&lt;strong&gt;Ордер №${id} · ${amount.toLocaleString(&#x27;ru-RU&#x27;)} фишек&lt;/strong&gt;&lt;small&gt;Осталось ${amount.toLocaleString(&#x27;ru-RU&#x27;)} · номер **** ${lastFour}&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;seka-order-status&quot;&gt;Активен&lt;/span&gt;&lt;div class=&quot;seka-admin-order-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-action&quot; data-edit-order=&quot;${id}&quot;&gt;Изменить&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;seka-admin-action seka-danger&quot; data-cancel-order=&quot;${id}&quot;&gt;Отменить&lt;/button&gt;&lt;/div&gt;`;
    root.querySelector(&#x27;[data-admin-order-list]&#x27;).append(adminRow);

    closeSheets();
    showToast(`Ордер №${id} добавлен в очередь по ${Math.floor(amount / 5000)} лотам`);
    haptic(&#x27;success&#x27;);
  });

  const betRange = root.querySelector(&#x27;.seka-bet-range&#x27;);
  betRange.addEventListener(&#x27;input&#x27;, () =&gt; {
    root.querySelector(&#x27;[data-bet-value]&#x27;).textContent = Number(betRange.value).toLocaleString(&#x27;ru-RU&#x27;);
  });

  root.querySelector(&#x27;[data-confirm-bet]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const amount = Number(betRange.value);
    const pot = root.querySelector(&#x27;[data-pot]&#x27;);
    const currentPot = Number(pot.textContent.replace(/\D/g, &#x27;&#x27;)) || 0;
    pot.textContent = (currentPot + amount).toLocaleString(&#x27;ru-RU&#x27;);
    closeSheets();
    showToast(`Ставка повышена до ${amount.toLocaleString(&#x27;ru-RU&#x27;)} фишек`);
    haptic(&#x27;success&#x27;);
  });

  if (telegramApp) {
    root.classList.add(&#x27;seka-telegram-host&#x27;);
    try {
      telegramApp.ready();
      telegramApp.expand();
      telegramApp.setHeaderColor?.(&#x27;#04130f&#x27;);
      telegramApp.setBackgroundColor?.(&#x27;#04130f&#x27;);
      telegramApp.setBottomBarColor?.(&#x27;#04130f&#x27;);
      telegramApp.BackButton?.onClick(navigateBack);
      telegramApp.onEvent?.(&#x27;viewportChanged&#x27;, syncTelegramViewport);
      telegramApp.onEvent?.(&#x27;safeAreaChanged&#x27;, syncTelegramViewport);
      telegramApp.onEvent?.(&#x27;contentSafeAreaChanged&#x27;, syncTelegramViewport);
    } catch (_) {}
    syncTelegramViewport();
    syncNativeBackButton();
  }

  setTimeout(() =&gt; root.querySelector(&#x27;.seka-player[data-seat=&quot;1&quot;] .seka-speech&#x27;)?.classList.add(&#x27;seka-say&#x27;), 1000);
  setTimeout(() =&gt; root.querySelector(&#x27;.seka-player[data-seat=&quot;1&quot;] .seka-speech&#x27;)?.classList.remove(&#x27;seka-say&#x27;), 3300);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

              &quot;--tooltip-available-width&quot;,

            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

        }
      });

    if (!trigger.isConnected || content.length === 0) {
      return;
    }

    if (activeTrigger === trigger) {
      return;
    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      updatePosition(trigger, floating);
    });

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;

      openTooltip(trigger);
      return;
    }

      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    if (event.pointerType === &quot;touch&quot;) {

    }

    const trigger = getTrigger(event.target);

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
